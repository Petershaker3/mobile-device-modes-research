name: ci

# Runs the three things this repository claims are true but that nobody has
# executed yet: the contracts reject bad documents, the corpus generates and
# verifies, and the transplanted C# builds and its copied tests pass.
#
# The core library is deliberately portable (net10.0, no WinForms), so the build
# runs on both Linux and Windows. That is how the portability claim gets proven
# rather than asserted.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The vendored tests assert Chinese UI strings ("越界" etc.) because that is
  # what upstream's Chinese-language app produces. Linux runners default to the
  # invariant culture, which is not zh-CN, so pin it here rather than weaken the
  # tests. ICU ships with the runner image, so this is enough on its own.
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 'false'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------- contracts
  contracts:
    name: contracts + corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: pip install -r contracts/tools/requirements.txt

      - name: Validate contracts (schemas, examples, negative cases)
        run: python contracts/tools/validate_contracts.py

      - name: Generate corpus and verify it
        run: python contracts/tools/make_fixtures.py

      - name: Regenerate and confirm determinism
        run: |
          python - <<'PY'
          import hashlib, pathlib, subprocess, sys
          root = pathlib.Path('contracts/corpus')
          def digest():
              h = hashlib.sha256()
              for p in sorted(root.rglob('*')):
                  if p.is_file() and p.name != 'GENERATED.json' and p.suffix != '.json':
                      h.update(p.name.encode())
                      h.update(p.read_bytes())
              return h.hexdigest()
          before = digest()
          subprocess.run([sys.executable, 'contracts/tools/make_fixtures.py'], check=True,
                         stdout=subprocess.DEVNULL)
          after = digest()
          print('before', before)
          print('after ', after)
          if before != after:
              print('FAIL: corpus generation is not deterministic')
              sys.exit(1)
          print('OK: regeneration produced identical bytes')
          PY

      - name: Verify the corpus refuses PII
        run: |
          # check() already rejects 15-digit Luhn-valid runs, but prove the guard
          # itself works by feeding it a known-valid IMEI-shaped number.
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('mf', 'contracts/tools/make_fixtures.py')
          mf = importlib.util.module_from_spec(spec); spec.loader.exec_module(mf)
          real_imei = '490154203237518'      # published Luhn-valid example, not a device
          if not mf._luhn_valid(real_imei):
              print('FAIL: guard does not flag a Luhn-valid 15-digit number'); sys.exit(1)
          if mf._luhn_valid('123456789012345'):
              print('FAIL: guard flags a non-Luhn number'); sys.exit(1)
          print('OK: PII guard behaves')
          PY

  # ------------------------------------------------------------ build + test
  build:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      # No `cache:` here on purpose. actions/setup-dotnet fails the step when the
      # cache-dependency-path does not exist yet, and packages.lock.json only
      # appears once `dotnet restore --use-lock-file` has run at least once.
      # Adding a cache key that breaks the build is the wrong trade for a repo
      # this small.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore DeviceToolkit.slnx

      - name: Build
        run: dotnet build DeviceToolkit.slnx -c Release --no-restore

      # --logger console is omitted on purpose: GitHub's log retrieval from this
      # sandbox is blocked, so the only channel that reaches me is a check-run
      # annotation. test-report.py parses the trx and emits one annotation per
      # failing test, which makes the failure visible without the raw log.
      # `dotnet test` exits non-zero as soon as any test fails, which on Linux is
      # expected for the four POSIX-vs-Windows cases. Without this the job would
      # fail before the reporter could judge whether the failures are the known
      # ones - the exit code would be the verdict instead of the evidence.
      # On Windows nothing is allowed to fail, so the step stays fatal there and
      # the reporter also runs strictly.
      - name: Test
        continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
        run: >
          dotnet test DeviceToolkit.slnx -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --results-directory TestResults

      # On Windows every test must pass. On Linux five of them assert behaviour
      # that only Windows has (see ci/known-linux-diffs.txt); the reporter accepts
      # exactly those five and fails on anything else, including a listed test
      # that starts passing.
      - name: Summarise failures as annotations
        if: always()
        run: >
          python .github/scripts/test-report.py TestResults
          ${{ matrix.os == 'ubuntu-latest'
              && '--allow ci/known-linux-diffs.txt'
              || '--strict' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

  # ------------------------------------------------------- posix path semantics
  # Upstream is a Windows-only app, and several copied tests encode Windows path
  # semantics directly: they expect Path.GetFullPath("Z:\\no-access\\...") to
  # round-trip unchanged, and they rely on Windows refusing to delete a directory
  # that another handle holds open. On Linux those expectations are simply false -
  # "Z:\\no-access" is a relative filename, and open files do not block unlink.
  #
  # So the Linux matrix job is verifying something narrower and still valuable:
  # the library compiles and all 432 platform-neutral tests pass. The 5 tests that
  # assert Windows behaviour run here on Windows, where they are meaningful.
  # Weakening them to no-ops would delete real coverage for the shipping platform.
  # ------------------------------------------------------- transplant integrity
  integrity:
    name: transplanted code is unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Diff every copied file against upstream
        run: bash scripts/verify-transplant.sh --no-build

      # Loc.cs originally hand-picked 19 of upstream's 643 translation keys, and CI
      # caught the gap only because one copied test happened to assert a missing
      # string. These two steps make that class of bug impossible to ship again:
      # the table is regenerated from upstream and must not drift, and every
      # literal key the core uses must exist in it.
      - name: Regenerate the translation table from upstream and require no drift
        run: |
          bash scripts/verify-transplant.sh --no-build --fetch-only
          # TMPDIR is not set on GitHub runners; use the same default as
          # verify-transplant.sh (${TMPDIR:-/tmp}) instead of assuming.
          python scripts/gen-loctable.py --upstream "${TMPDIR:-/tmp}/logcat-viewer-upstream" --check

      - name: Verify every localisation key the core uses exists
        run: python scripts/check-loc-keys.py

      - name: Check internal documentation links
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path('.')
          md = [p for p in root.rglob('*.md')
                if '.git' not in p.parts and 'node_modules' not in p.parts]
          broken = []
          for path in md:
              text = path.read_text(encoding='utf-8', errors='replace')
              for target in re.findall(r'\]\((?!https?:)([^)#]+\.md)', text):
                  if not (path.parent / target).resolve().exists():
                      broken.append(f'{path}: {target}')
          for line in broken:
              print('BROKEN', line)
          sys.exit(1 if broken else 0)
          PY
